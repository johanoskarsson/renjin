name: Build and Publish

on:
  push:
    branches: [ master ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib libgmp-dev libz-dev unzip

      - name: Set up GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: 4.8
          platform: x64

      - name: Build with Gradle
        run: |
          ./gradlew build

      - name: Set version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "RENJIN_RELEASE=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          else
            echo "BUILD_NUMBER=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          fi

      - name: Configure GitHub Packages
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish to GitHub Packages
        run: |
          # Apply maven publishing configuration to all subprojects
          for dir in */; do
            if [ -f "$dir/build.gradle" ]; then
              echo "apply from: '../gradle/maven.gradle'" >> "$dir/build.gradle"
            fi
          done
          
          # Add GitHub Packages repository to publishing
          cat << EOF >> build.gradle
          
          subprojects {
            publishing {
              repositories {
                maven {
                  name = "GitHubPackages"
                  url = "https://maven.pkg.github.com/\${System.getenv('GITHUB_REPOSITORY')}"
                  credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                  }
                }
              }
            }
          }
          EOF
          
          ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}